# 맥미니 배포 오버레이 — 호스트 포트 0개 + 터널까지 한 compose.
# 챗봇은 포트를 발행하지 않고, cloudflared 컨테이너가 내부망(chatbot:8000)으로 접근한다.
# 터널은 로컬 config.yml(ingress) + credentials 파일 마운트 방식(크로스/동일 계정 무관하게 동작).
services:
  chatbot:
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tax-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel-creds.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - chatbot
    restart: unless-stopped
